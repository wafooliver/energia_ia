[project]
name = "energia-smart-dashboard"
version = "1.0.0"
description = "Dashboard de pilotage énergétique régional pour optimiser la recharge d'une flotte"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.40",
  "pandas>=2.2",
  "pyarrow>=17",
  "numpy>=1.26",
  "plotly>=5.24",
  "scikit-learn>=1.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
